<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>善商薪資大師 2026 - 專業明細版</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root { --primary: #1a73e8; --bg: #f8f9fa; --card: #ffffff; --danger: #d93025; }
        body { font-family: 'Noto Sans TC', sans-serif; background: var(--bg); margin: 0; padding: 15px; }
        .container { max-width: 1000px; margin: auto; }
        .card { background: var(--card); border-radius: 16px; padding: 25px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); margin-bottom: 20px; }
        h1 { text-align: center; color: var(--primary); }
        .config-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; align-items: center; }
        .scroll-container { overflow-x: auto; border-radius: 12px; border: 1px solid #eee; margin-top: 15px; }
        table { width: 100%; border-collapse: collapse; min-width: 750px; }
        th { background: #f1f3f4; padding: 10px; font-size: 13px; color: #5f6368; border: 1px solid #ddd; }
        td { padding: 8px; border: 1px solid #eee; text-align: center; }
        select { padding: 5px; width: 60px; }
        input[type="number"] { padding: 5px; text-align: center; }
        .input-narrow { width: 45px !important; }
        .btn-calc { width: 100%; padding: 18px; background: var(--primary); color: white; border: none; border-radius: 12px; font-size: 20px; font-weight: bold; cursor: pointer; margin-top: 20px; }
        /* 報告明細樣式 */
        .report-section { margin-top: 20px; }
        .report-title { background: #34495e; color: white; padding: 8px 12px; font-weight: bold; border-radius: 4px; margin-bottom: 10px; }
        .report-table { width: 100%; margin-bottom: 15px; font-size: 12px; }
        .report-table th, .report-table td { border: 1px solid #ccc; padding: 6px; }
        .final-pay-box { background: #e8f0fe; padding: 20px; border-radius: 12px; text-align: center; border: 2px solid var(--primary); }
        .final-pay-box span { font-size: 32px; color: var(--danger); font-weight: 900; }
        .btn-export { width: 100%; padding: 12px; background: #5f6368; color: white; border: none; border-radius: 8px; cursor: pointer; margin-top: 10px; }
    </style>
</head>
<body>
<div class="container">
    <div class="card">
        <h1>善商薪資大師 2026</h1>
        <div class="config-grid">
            <div>時薪(A)：<input type="number" id="baseRate" value="216" style="width:60px" onchange="saveData()"></div>
            <div><input type="checkbox" id="hasAtt" onchange="saveData()"> <label for="hasAtt" style="font-weight:bold; color:#d35400;">全勤加給 (+10)</label></div>
            <div>模式：<select id="mode" onchange="switchMode()" style="width:100px"><option value="week">週薪</option><option value="month">月薪</option></select>
            <input type="month" id="selMonth" value="2026-01" onchange="switchMode()" style="display:none;"></div>
        </div>
    </div>

    <div class="card">
        <div class="scroll-container">
            <table>
                <thead><tr><th>日期</th><th>上班</th><th>下班</th><th>休息</th><th>移動</th><th>雙倍</th><th>狀態</th></tr></thead>
                <tbody id="inputRows"></tbody>
            </table>
        </div>
        <button class="btn-calc" onclick="calculateSalary()">產生 2026 詳細報告</button>
    </div>

    <div id="reportCard" class="card" style="display:none;">
        <h3 style="text-align:center;">薪資給付明細單</h3>
        
        <div class="report-section">
            <div class="report-title">一、基數與時數</div>
            <table class="report-table">
                <tr><th>合計時薪(B)</th><th>一般時數</th><th>加班(1.34)</th><th>加班(1.67)</th><th>第6天(2.67)</th><th>深夜總時數</th></tr>
                <tr><td id="res_B">0</td><td id="res_h_norm">0</td><td id="res_h_ot1">0</td><td id="res_h_ot2">0</td><td id="res_h_ot3">0</td><td id="res_h_night">0</td></tr>
            </table>
        </div>

        <div class="report-section">
            <div class="report-title">二、收入明細 (先加後乘)</div>
            <table class="report-table">
                <tr><th>本薪收入</th><th>加班費合計</th><th>深夜加給合計</th><th>收入總計</th></tr>
                <tr><td id="res_m_base">0</td><td id="res_m_ot">0</td><td id="res_m_night">0</td><td id="res_m_gross">0</td></tr>
            </table>
        </div>

        <div class="report-section">
            <div class="report-title">三、2026 減項扣款</div>
            <table class="report-table">
                <tr><th>勞保費</th><th>健保費</th><th>二代健保</th><th>福利金</th><th>扣款合計</th></tr>
                <tr><td id="res_m_lab">0</td><td id="res_m_hea">0</td><td id="res_m_gen2">0</td><td id="res_m_wel">0</td><td id="res_m_minus">0</td></tr>
            </table>
        </div>

        <div class="final-pay-box">實領金額：<br><span>NT$ <span id="r_final">0</span></span></div>
        <button class="btn-export" onclick="exportAsImage()">📸 下載薪資單圖片</button>
    </div>
</div>
<script src="salary.js"></script>
</body>
</html>
